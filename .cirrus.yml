# Android release pipeline on Cirrus CI.
# Runs only for tags matching: v* or *-v*

android_release_task:
  name: Android Release APK + EAS Update
  only_if: $CIRRUS_TAG != '' && ($CIRRUS_TAG =~ '^v.*$' || $CIRRUS_TAG =~ '.*-v.*')

  # If your org uses compute credits for private repos, uncomment:
  # use_compute_credits: true

  env:
    ABI: arm64-v8a
    CIRRUS_CLONE_DEPTH: '0'
    CIRRUS_CLONE_TAGS: 'true'
    CIRRUS_SHELL: bash

  container:
    image: ghcr.io/cirruslabs/android-sdk:36-ndk
    cpu: 4
    memory: 16G

  npm_cache:
    folder: /root/.npm
    fingerprint_script:
      - cat package-lock.json

  gradle_cache:
    folders:
      - /root/.gradle/caches
      - /root/.gradle/wrapper
    fingerprint_script:
      - cat android/gradle/wrapper/gradle-wrapper.properties
      - cat android/build.gradle
      - cat android/app/build.gradle

  install_node_script: |
    set -euo pipefail
    if command -v node >/dev/null 2>&1 && node -v | grep -q '^v22\.'; then
      node -v
      npm -v
      exit 0
    fi

    apt-get update
    apt-get install -y curl ca-certificates gnupg python3

    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
      | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    chmod a+r /etc/apt/keyrings/nodesource.gpg

    echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" \
      > /etc/apt/sources.list.d/nodesource.list

    apt-get update
    apt-get install -y nodejs

    node -v
    npm -v
    python3 --version

  install_android_sdk_deps_script: |
    set -euo pipefail
    sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
    set +o pipefail
    yes 2>/dev/null | sdkmanager --licenses >/dev/null
    set -o pipefail

  install_npm_deps_script: npm ci

  fetch_codex_deps_script: python3 scripts/fetch_android_codex_deps.py --abi "${ABI}"

  build_release_apk_script: |
    set -euo pipefail
    cd android
    chmod +x ./gradlew
    sed -i 's/\r$//' ./gradlew
    ./gradlew :app:assembleRelease -PreactNativeArchitectures="${ABI}" --no-daemon

  collect_apk_script: |
    set -euo pipefail
    mkdir -p dist
    cp "android/app/build/outputs/apk/release/app-release.apk" "dist/codexm-${CIRRUS_TAG}-${ABI}.apk"
    ls -lah dist

  publish_github_release_script: |
    set -euo pipefail
    if [ -z "${GITHUB_TOKEN:-}" ]; then
      echo "Missing GITHUB_TOKEN in Cirrus variables."
      exit 1
    fi
    python3 scripts/ci/publish_github_release.py "dist/codexm-${CIRRUS_TAG}-${ABI}.apk"

  publish_eas_update_script: |
    set -euo pipefail
    if [ -z "${EXPO_TOKEN:-}" ]; then
      echo "Missing EXPO_TOKEN in Cirrus variables."
      exit 1
    fi
    npx eas-cli@latest update \
      --branch "${EAS_UPDATE_BRANCH:-production}" \
      --platform android \
      --message "release ${CIRRUS_TAG}" \
      --non-interactive

  always:
    release_apk_artifacts:
      path: dist/codexm-*.apk
