name: Flutter Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: flutter-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter arm64 release
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      artifact_basename: ${{ steps.version.outputs.artifact_basename }}
    defaults:
      run:
        working-directory: flutter_app

    env:
      KEYSTORE_FILE: ${{ secrets.FLUTTER_ANDROID_KEYSTORE_FILE }}
      KEYSTORE_PASSWORD: ${{ secrets.FLUTTER_ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.FLUTTER_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.FLUTTER_ANDROID_KEY_PASSWORD }}
      CODEX_TERMUX_TAG: ${{ vars.CODEX_TERMUX_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK deps
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          # App targets Android 36, while some plugin modules still compile against older SDKs.
          # Install both to avoid relying on whatever the hosted runner happens to preinstall.
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Validate Android signing config
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_FILE}" ]] || missing+=("FLUTTER_ANDROID_KEYSTORE_FILE")
          [[ -n "${KEYSTORE_PASSWORD}" ]] || missing+=("FLUTTER_ANDROID_KEYSTORE_PASSWORD")
          [[ -n "${KEY_ALIAS}" ]] || missing+=("FLUTTER_ANDROID_KEY_ALIAS")
          [[ -n "${KEY_PASSWORD}" ]] || missing+=("FLUTTER_ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Android signing secrets: %s\n' "${missing[*]}" >&2
            printf 'GitHub release APKs must use one stable release keystore to remain upgradeable.\n' >&2
            exit 1
          fi

      - name: Prepare Android signing keystore
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${KEYSTORE_FILE}" ]]; then
            echo "Using existing keystore file: ${KEYSTORE_FILE}"
            exit 0
          fi

          OUT="${GITHUB_WORKSPACE}/flutter_app/android/release.keystore.jks"
          mkdir -p "$(dirname "${OUT}")"

          if ! printf '%s' "${KEYSTORE_FILE}" | base64 --decode > "${OUT}" 2>/dev/null; then
            echo "KEYSTORE_FILE is set but is neither an existing file path nor valid base64 keystore content." >&2
            exit 1
          fi

          chmod 600 "${OUT}" || true
          echo "KEYSTORE_FILE=${OUT}" >> "${GITHUB_ENV}"
          echo "Prepared keystore file for release signing."

      - name: Fetch Codex Android deps
        working-directory: .
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_android_codex_deps.py --abi arm64-v8a

      - name: Flutter CI sanity
        working-directory: .
        run: bash ./scripts/flutter_ci_sanity.sh

      - name: Derive version from tag
        id: version
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            if [[ ! "${VERSION_NAME}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]]; then
              echo "Unsupported tag format: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION_CODE="$((10#${MAJOR} * 1000000 + 10#${MINOR} * 1000 + 10#${PATCH}))"
            ARTIFACT_BASENAME="codexm-${VERSION_NAME}-arm64-v8a"
          else
            # workflow_dispatch (and other non-tag triggers): fall back to pubspec version
            # and use the run number as a unique Android versionCode.
            PUBSPEC_VERSION="$(
              grep -E '^[[:space:]]*version:[[:space:]]*' flutter_app/pubspec.yaml \
                | head -n 1 \
                | sed -E 's/^[[:space:]]*version:[[:space:]]*//'
            )"
            PUBSPEC_VERSION="${PUBSPEC_VERSION%%[[:space:]]*}"
            if [[ -z "${PUBSPEC_VERSION}" ]]; then
              echo "Unable to read version from flutter_app/pubspec.yaml" >&2
              exit 1
            fi
            VERSION_NAME="${PUBSPEC_VERSION%%+*}"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
            ARTIFACT_BASENAME="codexm-${VERSION_NAME}-arm64-v8a-ci-${GITHUB_RUN_NUMBER}"
          fi
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "ARTIFACT_BASENAME=${ARTIFACT_BASENAME}"
          } >> "${GITHUB_ENV}"
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "artifact_basename=${ARTIFACT_BASENAME}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build arm64 release APK
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --split-per-abi
          --build-name "${VERSION_NAME}"
          --build-number "${VERSION_CODE}"

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          SIGNATURE_INFO="$(${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner verify --print-certs "${APK}")"
          printf '%s\n' "${SIGNATURE_INFO}"
          if [[ "${SIGNATURE_INFO}" == *"CN=Android Debug"* ]]; then
            echo 'Refusing to publish a debug-signed release APK.' >&2
            exit 1
          fi

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "dist/${ARTIFACT_BASENAME}.apk"
          (
            cd dist
            zip -9 "${ARTIFACT_BASENAME}.zip" "${ARTIFACT_BASENAME}.apk"
          )

      - name: Upload release artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_basename }}
          path: |
            flutter_app/dist/${{ steps.version.outputs.artifact_basename }}.apk
            flutter_app/dist/${{ steps.version.outputs.artifact_basename }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          fail_on_unmatched_files: true
          files: |
            flutter_app/dist/${{ steps.version.outputs.artifact_basename }}.apk
            flutter_app/dist/${{ steps.version.outputs.artifact_basename }}.zip
